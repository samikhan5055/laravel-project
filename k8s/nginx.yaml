apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-web
  namespace: laravel-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel-web
  template:
    metadata:
      labels:
        app: laravel-web
    spec:
      containers:
        - name: nginx
          image: sami1800/laravel-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-web-service
  namespace: laravel-k8s
spec:
  type: NodePort
  selector:
    app: laravel-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
